name: Daily Auto Stock Radar (16:30)

on:
  schedule:
    # 台灣時間週一至週五 16:30 (對應 UTC 時間 08:30)
    - cron: '30 8 * * 1-5'
  # 允許隨時在網頁手動點擊測試
  workflow_dispatch:

jobs:
  screen-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝所需套件
        run: |
          pip install requests pandas yfinance

      - name: 執行 3-1-2 獵股雷達
        run: |
          python screener.py

      - name: 自動提交並推送更新後的名單至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          # 如果檔案有變更才進行 commit 與 push
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新今日深蹲觀察名單 [skip ci]" && git push)
