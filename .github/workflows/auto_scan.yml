name: Daily Auto Stock Radar (16:30)

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

# 授權 GitHub Actions 具備寫入儲存庫的權限
permissions:
  contents: write

jobs:
  screen-and-track:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝所需套件
        run: |
          pip install requests pandas yfinance

      - name: 1. 執行 3-1-2 獵股雷達
        run: |
          python screener.py

      - name: 2. 執行實盤部位與帳本追蹤 (方案 B)
        run: |
          python tracker.py

      - name: 3. 自動提交並推送帳本與戰報至 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新雷達戰報與實盤追蹤帳本 [skip ci]" && git push)
